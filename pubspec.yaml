name: deutsch_mate
description: A German learning companion aligned to the Menschen syllabus (A1.1 to B1.2).
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter floor is 3.27: Color.withValues (used instead of the deprecated
  # withOpacity) does not exist before it.
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  # 3.x compiles against android-31, while its own transitive
  # androidx.annotation-experimental:1.4.0 requires compileSdk 34+, so the
  # Android build cannot be configured at all on 3.x.
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
