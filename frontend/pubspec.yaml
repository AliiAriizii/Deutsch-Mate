name: deutsch_mate
description: A German learning companion aligned to the Menschen syllabus (A1.1 to B1.2).
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter floor is 3.27: Color.withValues (used instead of the deprecated
  # withOpacity) does not exist before it.
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Ships the Material/Cupertino strings and the bidi machinery for fa, so the
  # Persian UI mirrors instead of rendering RTL text in an LTR layout.
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  # 3.x compiles against android-31, while its own transitive
  # androidx.annotation-experimental:1.4.0 requires compileSdk 34+, so the
  # Android build cannot be configured at all on 3.x.
  flutter_tts: ^4.2.5
  # Tokens must not sit in SharedPreferences - Keystore/Keychain instead.
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^7.0.0
  http: ^1.2.0
  # SHA-256 for the sign-in nonce, which Google echoes hashed.
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/

  # Bundled, not fetched. The app is offline-first, so a runtime font download
  # would mean a first launch with no typography.
  #
  # These are variable fonts - upstream publishes no static instances - so
  # weight and width are selected in the theme via FontVariation rather than by
  # declaring one file per weight here.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Instrument
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
